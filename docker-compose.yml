services:
  postgres:
    image: postgres:17.6
    command: [ "postgres", "-c", "max_connections=192", "-c", "track_wal_io_timing=on", "-c", "commit_delay=1000" ]
    environment:
      POSTGRES_DB: saas
      POSTGRES_PASSWORD: local-bootstrap-only
    ports: [ "127.0.0.1:5558:5432" ]
    volumes: [ "./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro", "pg:/var/lib/postgresql/data" ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d saas" ]
      interval: 3s
      retries: 20
  redis:
    image: redis:7.4.6-alpine
    command: [ "redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru" ]
    ports: [ "127.0.0.1:6388:6379" ]
  kafka:
    image: apache/kafka:3.9.1
    ports: [ "127.0.0.1:9099:9092" ]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,INTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9099,INTERNAL://kafka:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.2
    command: start-dev --import-realm
    ports: [ "127.0.0.1:8188:8080" ]
    volumes: [ "./docker/realm.json:/opt/keycloak/data/import/realm.json:ro" ]
  app:
    build: .
    ports: [ "127.0.0.1:8088:8080" ]
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/saas
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_SERVERS: kafka:9094
      MESSAGING_ENABLED: true
      OIDC_JWK_URI: http://keycloak:8080/realms/saas/protocol/openid-connect/certs
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      kafka: { condition: service_started }
      keycloak: { condition: service_started }
volumes:
  pg:
