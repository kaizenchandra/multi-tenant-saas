# Development only. Dependencies remain in this project's loopback Compose stack.
apiVersion: v1
kind: Namespace
metadata:
  name: saas-isolation-dev
  labels: { app.kubernetes.io/part-of: multi-tenant-saas }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: saas, namespace: saas-isolation-dev }
spec:
  replicas: 2
  selector: { matchLabels: { app: saas } }
  template:
    metadata: { labels: { app: saas } }
    spec:
      terminationGracePeriodSeconds: 45
      securityContext: { runAsNonRoot: true, runAsUser: 10001 }
      containers:
        - name: app
          image: multi-tenant-saas-app:latest
          imagePullPolicy: Never
          ports: [ { containerPort: 8080 } ]
          env:
            - { name: DB_URL, value: 'jdbc:postgresql://saas-postgres:5432/saas' }
            - { name: REDIS_HOST, value: saas-redis }
            - { name: REDIS_PORT, value: '6379' }
            - { name: OIDC_ISSUER, value: 'http://localhost:8188/realms/saas' }
            - { name: OIDC_JWK_URI, value: 'http://host.docker.internal:8188/realms/saas/protocol/openid-connect/certs' }
            - { name: SAAS_QUOTAS_LEASED_REQUESTS, value: 'true' }
            - { name: SAAS_ADMISSION_GLOBAL_CAPACITY, value: '28' }
            - { name: SAAS_ADMISSION_PER_TENANT, value: '6' }
            - { name: SAAS_ADMISSION_WAIT_MS, value: '100' }
            - { name: MANAGEMENT_PORT, value: '8081' }
            - { name: SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE, value: '20s' }
            - { name: SPRING_THREADS_VIRTUAL_ENABLED, value: 'false' }
            - { name: SPRING_FLYWAY_ENABLED, value: 'false' }
            - { name: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE, value: '30' }
            - { name: MESSAGING_ENABLED, value: 'false' }
            - { name: WORKERS_ENABLED, value: 'false' }
          resources:
            requests: { cpu: '2.5', memory: 384Mi }
            limits: { cpu: '2.5', memory: 1Gi }
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: [ ALL ] }
          lifecycle:
            preStop:
              exec: { command: [ "/bin/sh", "-c", "sleep 5" ] }
          startupProbe: { httpGet: { path: /actuator/health/liveness, port: 8081 }, periodSeconds: 2, failureThreshold: 30 }
          readinessProbe: { httpGet: { path: /actuator/health/readiness, port: 8081 }, periodSeconds: 3, timeoutSeconds: 2, failureThreshold: 3 }
          livenessProbe: { httpGet: { path: /actuator/health/liveness, port: 8081 }, periodSeconds: 10, timeoutSeconds: 2, failureThreshold: 3 }
          volumeMounts: [ { name: tmp, mountPath: /tmp } ]
      volumes: [ { name: tmp, emptyDir: { sizeLimit: 64Mi } } ]
---
apiVersion: v1
kind: Service
metadata: { name: saas, namespace: saas-isolation-dev }
spec:
  type: NodePort
  selector: { app: saas }
  ports: [ { port: 80, targetPort: 8080, nodePort: 30088 } ]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: saas, namespace: saas-isolation-dev }
spec:
  minAvailable: 1
  selector: { matchLabels: { app: saas } }
---
apiVersion: v1
kind: Service
metadata: { name: saas-management, namespace: saas-isolation-dev }
spec:
  selector: { app: saas }
  ports: [ { port: 8081, targetPort: 8081 } ]
