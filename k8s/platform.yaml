apiVersion: apps/v1
kind: Deployment
metadata: { name: saas }
spec:
  replicas: 3
  selector: { matchLabels: { app: saas } }
  strategy: { rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  template:
    metadata: { labels: { app: saas } }
    spec:
      terminationGracePeriodSeconds: 45
      securityContext: { runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001 }
      containers:
        - name: saas
          image: saas:1.0.0
          ports: [ { containerPort: 8080 } ]
          env:
            - { name: MANAGEMENT_PORT, value: '8081' }
            - { name: SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE, value: '20s' }
          envFrom:
            - configMapRef: { name: saas-config }
            - secretRef: { name: saas-secrets }
          resources:
            requests: { cpu: 500m, memory: 512Mi }
            limits: { cpu: '2', memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ ALL ] }
          volumeMounts: [ { name: tmp, mountPath: /tmp } ]
          lifecycle:
            preStop:
              exec: { command: [ "/bin/sh", "-c", "sleep 5" ] }
          startupProbe: { httpGet: { path: /actuator/health/liveness, port: 8081 }, failureThreshold: 30, periodSeconds: 5 }
          readinessProbe: { httpGet: { path: /actuator/health/readiness, port: 8081 }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /actuator/health/liveness, port: 8081 }, periodSeconds: 10 }
      volumes: [ { name: tmp, emptyDir: { sizeLimit: 64Mi } } ]
---
apiVersion: v1
kind: ConfigMap
metadata: { name: saas-config }
data:
  DB_URL: jdbc:postgresql://postgres.internal:5432/saas?sslmode=verify-full
  REDIS_HOST: redis.internal
  REDIS_PORT: '6379'
  OIDC_ISSUER: https://identity.example.com/realms/saas
  OIDC_JWK_URI: https://identity.example.com/realms/saas/protocol/openid-connect/certs
  KAFKA_SERVERS: kafka.internal:9093
  MESSAGING_ENABLED: 'true'
  SPRING_PROFILES_ACTIVE: production
  SPRING_FLYWAY_ENABLED: 'false'
---
apiVersion: v1
kind: Service
metadata: { name: saas }
spec:
  selector: { app: saas }
  ports: [ { port: 80, targetPort: 8080 } ]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: saas }
spec:
  minAvailable: 2
  selector: { matchLabels: { app: saas } }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: saas }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: saas }
  minReplicas: 3
  maxReplicas: 12
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 65 } }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: saas }
spec:
  podSelector: { matchLabels: { app: saas } }
  policyTypes: [ Ingress ]
  ingress:
    - from: [ { namespaceSelector: { matchLabels: { saas-access: allowed } } } ]
      ports: [ { port: 8080 } ]
    - from: [ { namespaceSelector: { matchLabels: { saas-observability: allowed } } } ]
      ports: [ { port: 8081 } ]
---
apiVersion: v1
kind: Service
metadata: { name: saas-management }
spec:
  selector: { app: saas }
  ports: [ { port: 8081, targetPort: 8081 } ]
