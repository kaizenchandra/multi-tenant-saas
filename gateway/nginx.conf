# TLS certificates are supplied by the deployment, never generated by the app.
worker_processes auto;
events { worker_connections 1024; }
http {
  limit_req_zone $binary_remote_addr zone=per_ip:10m rate=100r/s;
  limit_conn_zone $binary_remote_addr zone=connections:10m;
  upstream saas { server app:8080; keepalive 32; }
  server {
    listen 443 ssl;
    ssl_certificate /run/secrets/tls.crt;
    ssl_certificate_key /run/secrets/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 64k;
    client_body_timeout 5s;
    client_header_timeout 5s;
    keepalive_timeout 15s;
    limit_req zone=per_ip burst=50 nodelay;
    limit_req_status 429;
    limit_conn connections 30;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location / {
      proxy_pass http://saas;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Connection "";
      proxy_connect_timeout 2s;
      proxy_read_timeout 15s;
      proxy_send_timeout 5s;
    }
  }
}
