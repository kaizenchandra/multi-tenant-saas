groups:
  - name: saas
    rules:
      - alert: SaasHighErrorRate
        expr: sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) / clamp_min(sum(rate(http_server_requests_seconds_count[5m])),1) > 0.01
        for: 5m
        labels: { severity: page }
        annotations: { summary: "SaaS API error ratio above 1%" }
      - alert: SaasWorkerFailures
        expr: increase(saas_worker_failures_total[5m]) > 5
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "SaaS worker is repeatedly failing" }
      - alert: SaasPoolSaturated
        expr: hikaricp_connections_active / hikaricp_connections_max > 0.9
        for: 5m
        labels: { severity: page }
        annotations: { summary: "Database connection pool above 90%" }
      - alert: SaasQuotaBudgetReturnBacklog
        expr: saas_api_budget_pending_returns > 0
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "Known-unused API credits have not reconciled; inspect DB errors before any refund" }
      - alert: SaasThrottlingHigh
        expr: sum(rate(http_server_requests_seconds_count{status="429"}[5m])) / clamp_min(sum(rate(http_server_requests_seconds_count[5m])),1) > 0.01
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "Throttling exceeds 1%; distinguish admission pressure from expected tenant quota limits" }
